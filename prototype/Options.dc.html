<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8E1B3B}a:hover{color:#5E0F26}
.grain{background-color:#F5EDE3;background-image:radial-gradient(rgba(30,20,24,0.07) 1px,transparent 1px);background-size:5px 5px}
</style>
</helmet>
<div class="grain" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'DM Sans', system-ui, sans-serif; color: #1E1418; overflow: hidden">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px; overflow-y: auto">
    <a href="Mutual.dc.html" style="align-self: flex-start; color: #5E4C52; text-decoration: none; font-size: 15px; padding: 8px 0">‹ Mutual actions</a>
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #8E1B3B">New scene · step 3 of 4</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1">Pick a starting design</h1>
    <div style="font-size: 15px; color: #5E4C52; line-height: 1.4">Built from River’s profile, your offerings and your rules. Everything stays editable.</div>

    <sc-for list="{{designs}}" as="d" hint-placeholder-count="3">
      <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="text-align: left; background: #FFFAF4; border: 1px solid #E2D5C7; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-family: 'DM Sans', sans-serif; color: #1E1418; cursor: pointer">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">{{d.name}}</span>
          <sc-if value="{{d.on}}" hint-placeholder-val="{{false}}"><span style="background: #0B5D61; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px">SELECTED</span></sc-if>
        </div>
        <svg viewBox="0 0 320 60" width="100%" height="60" role="img" aria-label="{{d.curveLabel}}"><path d="{{d.path}}" fill="none" stroke="#B8400C" stroke-width="4" stroke-linecap="round"></path></svg>
        <div style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; width: 100%">
          <sc-for list="{{d.phases}}" as="p" hint-placeholder-count="5"><span style="flex-grow: {{p.w}}; background: {{p.c}}"></span></sc-for>
        </div>
        <div style="font-size: 14px; color: #5E4C52">{{d.stats}}</div>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px 18px; background: #FFFAF4; border-top: 1px solid #E2D5C7">
    <div style="font-size: 15px; color: #5E4C52">{{pickedName}}</div>
    <a href="Editor.dc.html" style="background: #B8400C; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px; padding: 14px 22px; border-radius: 14px">Use this one ›</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'two' }; }
  renderVals() {
    const A = '#8B6000', G = '#2E6B2E', R = '#4A4A4A', B = '#1A3A6B', C = '#8B0000', D = '#6E5A4E';
    const list = [
      { id: 'climb', name: 'Slow Climb', curveLabel: 'One long climb to a single peak',
        path: 'M0 55 C60 54 100 48 150 36 S240 6 270 8 S305 40 320 52',
        phases: [{ w: 2, c: A }, { w: 6, c: G }, { w: 1, c: D }, { w: 3, c: C }],
        stats: '3 hrs · 1 peak · aftercare 45 min (25%)' },
      { id: 'two', name: 'Two Peaks', curveLabel: 'Two peaks with active recovery between',
        path: 'M0 55 C30 54 50 44 80 30 S120 14 135 16 S160 44 180 42 S240 4 265 6 S300 44 320 54',
        phases: [{ w: 2, c: A }, { w: 3, c: G }, { w: 1, c: R }, { w: 3, c: B }, { w: 1, c: D }, { w: 4, c: C }],
        stats: '3 hrs · 2 peaks · intense · aftercare 60 min (33%)' },
      { id: 'drift', name: 'Velvet Drift', curveLabel: 'Gentle rolling waves, no sharp peak',
        path: 'M0 50 C40 40 60 30 90 34 S140 22 170 26 S220 18 250 24 S300 40 320 46',
        phases: [{ w: 2, c: A }, { w: 7, c: G }, { w: 1, c: D }, { w: 3, c: C }],
        stats: '3 hrs · gentle waves · aftercare 45 min (25%)' }
    ];
    const designs = list.map((d) => ({ ...d, on: this.state.picked === d.id, pick: () => this.setState({ picked: d.id }) }));
    const p = list.find((d) => d.id === this.state.picked);
    return { designs, pickedName: p ? p.name : '' };
  }
}
</script>
</body>
</html>
